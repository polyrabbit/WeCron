name: Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        # Required
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test
        run: make test

  docker-build-push:
    name: Docker Build
    runs-on: ubuntu-24.04
    needs: unit-test
    if: github.event_name == 'push'
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: polyrabbit/wecron:latest

  fly-deploy:
    name: Fly Deploy
    runs-on: ubuntu-24.04
    needs: docker-build-push
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Pin the digest just pushed, the `latest` tag may be stale in Fly's Docker Hub mirror
      - run: flyctl deploy --image polyrabbit/wecron@${{ needs.docker-build-push.outputs.digest }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
