name: Mini Program

on:
  push:
    branches: [ master ]
    paths: [ 'miniprogram/**', '.github/workflows/miniprogram.yml' ]
  workflow_dispatch:

jobs:
  upload:
    name: Upload
    runs-on: ubuntu-24.04
    concurrency: miniprogram-upload
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Upload
        env:
          UPLOAD_KEY: ${{ secrets.WX_MINIAPP_UPLOAD_KEY }}
        run: |
          key_file="$RUNNER_TEMP/upload.key"
          printf '%s\n' "$UPLOAD_KEY" > "$key_file"
          npx --yes miniprogram-ci@2.1.31 upload \
            --appid "$(node -p "require('./miniprogram/project.config.json').appid")" \
            --project-path ./miniprogram \
            --private-key-path "$key_file" \
            --use-project-config \
            --project-ignores 'tools/**/*' 'config.local.js' \
            --upload-version "1.0.${{ github.run_number }}" \
            --upload-description "${GITHUB_SHA::7} ${{ github.ref_name }}" \
            --robot 1
