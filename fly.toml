# fly.toml file generated for wecron on 2023-03-24T15:48:33+08:00

app = "wecron"
# Next to the database, Fly has retired hkg
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = 5
processes = []
# Covers rare memory spikes, as memory is trimmed below to save cost
swap_size_mb = 512

[build]
  image = "polyrabbit/wecron:latest"

[experimental]
  auto_rollback = true

[deploy]
  strategy = "bluegreen"

[[vm]]
  size = "shared-cpu-1x"
  memory = "768mb"

[[services]]
  internal_port = 8000
  processes = ["app"]
  protocol = "tcp"
  script_checks = []
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  # Passes once Django is loaded rather than when the port opens, so bluegreen deploys switch over in time
  [[services.http_checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "2s"
    method = "get"
    path = "/?healthy"
    protocol = "http"
    [services.http_checks.headers]
      Host = "wecron.fly.dev"

[[statics]]
  guest_path = "/staticfiles"
  url_prefix = "/static"
